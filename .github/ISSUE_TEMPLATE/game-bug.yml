name: Game bug
description: A bug in the game's Lua code, found while reading or using the atlas
labels: ["game-bug"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Game file and line, e.g. lua/vehicle/extensions/core/booster.lua:23
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: 0.40.5
    validations:
      required: true
  - type: textarea
    id: bug
    attributes:
      label: What happens
      description: What the code does, why it is wrong, and how to reproduce it in game if you tested it.
    validations:
      required: true
